# /etc/nginx/sites-available/api.mpupdate.com   (setup-vps.sh fills __PORT__ with the free port it found)
#
# What this gives you:
#  - HTTPS (Let's Encrypt via certbot), HTTP/2, gzip
#  - 30 s microcache for public read APIs (news list, menu, ads ...) -> a traffic spike never reaches Node/Mongo
#  - stale answers while Node restarts or is slow (proxy_cache_use_stale)
#  - rate limiting, upload size limit, real-IP forwarding, keep-alive connections to Node

proxy_cache_path /var/cache/nginx/mpupdate levels=1:2 keys_zone=mpapi:20m max_size=300m inactive=10m use_temp_path=off;
limit_req_zone $binary_remote_addr zone=mpapi_rl:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=mpapi_login:10m rate=5r/m;

upstream mpupdate_node {
    server 127.0.0.1:__PORT__;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.mpupdate.com;

    # certbot adds the HTTPS server block + redirect automatically (see DEPLOY.md)
    client_max_body_size 15m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types application/json text/plain text/css application/javascript image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---- public read APIs: cached for 30 s at Nginx (logged-in staff requests bypass the cache)
    location ~ ^/api/v1/(public/(menu|news|slugs)|news/all|category/all|ads/getAll|breakingNews/getAll|poll/get|story/getAll|yt/getAll|live/getAll)$ {
        limit_req zone=mpapi_rl burst=60 nodelay;
        proxy_pass http://mpupdate_node;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache mpapi;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 30s;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_bypass $http_authorization;
        proxy_no_cache $http_authorization;
        add_header X-Edge-Cache $upstream_cache_status;
    }

    # ---- login: strict rate limit
    location /api/v1/auth/ {
        limit_req zone=mpapi_login burst=10 nodelay;
        proxy_pass http://mpupdate_node;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- everything else (admin writes, uploads, single stories ...)
    location / {
        limit_req zone=mpapi_rl burst=80 nodelay;
        proxy_pass http://mpupdate_node;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
